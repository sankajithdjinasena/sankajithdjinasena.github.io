<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2235" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e111d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="400" height="22" rx="6" fill="#1e293b"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#cbd5e1">ridesync://transit.metro-bus/live-dispatch</text>
  <rect x="1000" y="42" width="140" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="1015" y="57" font-family="monospace" font-size="10" fill="#fbbf24">● FLEET DISPATCH</text>

  <!-- Title -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">RideSync - Public Transit Fleet &amp; Route Dispatch</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#94a3b8">REAL-TIME ROUTE TELEMETRY · DIGITAL TICKET BOOKING · CONFLICT-FREE FLEET SCHEDULING</text>

  <!-- Left: Live Transit Route Map & Stations -->
  <rect x="50" y="180" width="670" height="520" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Active Route Network &amp; Bus GPS Tracking</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#64748b">Corridor Line 104 · 18 Active Buses · 98.2% On-Time</text>

  <!-- Route Visualizer -->
  <g transform="translate(80, 265)">
    <rect width="610" height="280" fill="#070a14" rx="10" stroke="#1e293b"/>
    
    <!-- Curved Route Line -->
    <path d="M 50 140 C 180 50, 320 220, 560 110" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 50 140 C 180 50, 320 220, 560 110" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Stations / Stops -->
    <!-- Station 1 -->
    <circle cx="50" cy="140" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="50" y="175" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Central Terminal</text>
    <text x="50" y="190" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Departed</text>

    <!-- Station 2 -->
    <circle cx="190" cy="95" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="190" y="65" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">City Center</text>

    <!-- Moving Bus Indicator -->
    <g transform="translate(290, 140)">
      <circle cx="0" cy="0" r="18" fill="#f59e0b" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
      <rect x="-35" y="-35" width="70" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="0" y="-21" font-family="monospace" font-size="9" font-weight="bold" fill="#f59e0b" text-anchor="middle">BUS #42 (45 mph)</text>
    </g>

    <!-- Station 3 -->
    <circle cx="390" cy="180" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="390" y="210" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Tech Park</text>

    <!-- Station 4 -->
    <circle cx="560" cy="110" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="560" y="145" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Airport Express</text>
    <text x="560" y="160" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ETA 12 min</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="190" height="110" rx="10" fill="#070a14" stroke="#1e293b"/>
    <text x="18" y="30" font-family="monospace" font-size="11" fill="#64748b">DAILY COMMUTERS</text>
    <text x="18" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#f59e0b">14,280</text>
    <text x="18" y="92" font-family="monospace" font-size="10" fill="#10b981">+12% Peak Surge</text>

    <rect x="210" y="0" width="190" height="110" rx="10" fill="#070a14" stroke="#1e293b"/>
    <text x="228" y="30" font-family="monospace" font-size="11" fill="#64748b">AVERAGE WAIT TIME</text>
    <text x="228" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#38bdf8">4.2 min</text>
    <text x="228" y="92" font-family="monospace" font-size="10" fill="#94a3b8">High Frequency</text>

    <rect x="420" y="0" width="190" height="110" rx="10" fill="#070a14" stroke="#1e293b"/>
    <text x="438" y="30" font-family="monospace" font-size="11" fill="#64748b">SEAT OCCUPANCY</text>
    <text x="438" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#10b981">84.6%</text>
    <text x="438" y="92" font-family="monospace" font-size="10" fill="#94a3b8">Optimized Fleet</text>
  </g>

  <!-- Right: Seat Matrix & Passenger Flow -->
  <rect x="740" y="180" width="410" height="520" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Dynamic Seat Allocation Engine</text>
  <text x="770" y="240" font-family="monospace" font-size="11" fill="#64748b">Bus #42 Seat Availability (40 Seats)</text>

  <!-- Seat Grid -->
  <g transform="translate(770, 270)">
    <rect width="350" height="260" fill="#070a14" rx="10" stroke="#1e293b"/>
    
    <!-- Driver Seat -->
    <rect x="30" y="20" width="40" height="30" rx="4" fill="#334155"/>
    <text x="50" y="40" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Wheel</text>

    <!-- Seats Row 1 -->
    <rect x="100" y="20" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="145" y="20" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="235" y="20" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="280" y="20" width="35" height="30" rx="4" fill="#10b981"/>

    <!-- Row 2 -->
    <rect x="100" y="60" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="145" y="60" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="235" y="60" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="280" y="60" width="35" height="30" rx="4" fill="#10b981"/>

    <!-- Row 3 -->
    <rect x="100" y="100" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="145" y="100" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="235" y="100" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>
    <rect x="280" y="100" width="35" height="30" rx="4" fill="#ef4444" fill-opacity="0.8"/>

    <!-- Row 4 -->
    <rect x="100" y="140" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="145" y="140" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="235" y="140" width="35" height="30" rx="4" fill="#10b981"/>
    <rect x="280" y="140" width="35" height="30" rx="4" fill="#10b981"/>

    <!-- Legend -->
    <circle cx="100" cy="210" r="5" fill="#10b981"/>
    <text x="115" y="214" font-family="monospace" font-size="10" fill="#cbd5e1">Available (24)</text>

    <circle cx="230" cy="210" r="5" fill="#ef4444"/>
    <text x="245" y="214" font-family="monospace" font-size="10" fill="#cbd5e1">Booked (16)</text>
  </g>

  <!-- Technology Badges -->
  <g transform="translate(770, 560)">
    <rect width="350" height="110" rx="10" fill="#070a14" stroke="#1e293b"/>
    <text x="20" y="32" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Platform Architecture</text>
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="60" height="26" rx="13" fill="#1e293b"/>
      <text x="30" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">PHP</text>
      <rect x="68" y="0" width="70" height="26" rx="13" fill="#1e293b"/>
      <text x="103" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">MYSQL</text>
      <rect x="146" y="0" width="80" height="26" rx="13" fill="#1e293b"/>
      <text x="186" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">LEAFLET</text>
      <rect x="234" y="0" width="70" height="26" rx="13" fill="#1e293b"/>
      <text x="269" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">REST</text>
    </g>
  </g>
</svg>