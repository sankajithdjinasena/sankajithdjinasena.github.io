<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#110d2b"/>
      <stop offset="100%" stop-color="#050412"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1638" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e0a22" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#130e2e" stroke="#2a1f54" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="460" height="22" rx="6" fill="#24194c"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#c4b5fd">kaggle://mobile-device-telemetry/user-behavior-classification</text>
  <rect x="1000" y="42" width="140" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1015" y="57" font-family="monospace" font-size="10" fill="#a78bfa">● ML CLASSIFIER</text>

  <!-- Title -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">User Behavior Classification (Mobile Usage)</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#a78bfa">SUPERVISED MACHINE LEARNING · RANDOM FOREST &amp; XGBOOST · 5 BEHAVIOR PROFILES</text>

  <!-- Left: Behavioral Radar & Cluster Analysis -->
  <rect x="50" y="180" width="670" height="520" rx="16" fill="url(#cardBg)" stroke="#38296e" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Multi-Dimensional Behavioral Profiling Radar</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#8b5cf6">Screen Time · App Usage · Data Consumption · Battery Drain</text>

  <!-- Radar Chart Simulation -->
  <g transform="translate(415, 410)">
    <!-- Concentric Rings -->
    <polygon points="0,-130 123,-40 76,105 -76,105 -123,-40" fill="none" stroke="#3b2b73" stroke-width="1"/>
    <polygon points="0,-90 85,-28 53,73 -53,73 -85,-28" fill="none" stroke="#3b2b73" stroke-width="1"/>
    <polygon points="0,-50 47,-15 29,40 -29,40 -47,-15" fill="none" stroke="#3b2b73" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#4c3894"/>
    <line x1="0" y1="0" x2="123" y2="-40" stroke="#4c3894"/>
    <line x1="0" y1="0" x2="76" y2="105" stroke="#4c3894"/>
    <line x1="0" y1="0" x2="-76" y2="105" stroke="#4c3894"/>
    <line x1="0" y1="0" x2="-123" y2="-40" stroke="#4c3894"/>

    <!-- Labels -->
    <text x="0" y="-140" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">Screen Time (Daily Hrs)</text>
    <text x="135" y="-35" font-family="monospace" font-size="11" fill="#c4b5fd">App Opens</text>
    <text x="85" y="125" font-family="monospace" font-size="11" fill="#c4b5fd">Battery Drain (mAh)</text>
    <text x="-85" y="125" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="end">Data Usage (GB)</text>
    <text x="-135" y="-35" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="end">Age Group</text>

    <!-- Cluster 1: Power User (Cyan) -->
    <polygon points="0,-115 110,-35 68,95 -65,90 -95,-30" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="2"/>

    <!-- Cluster 2: Casual User (Magenta) -->
    <polygon points="0,-55 50,-18 35,45 -40,35 -60,-20" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 595)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#0e0a22" stroke="#2a1f54"/>
    <circle cx="20" cy="25" r="5" fill="#06b6d4"/>
    <text x="35" y="29" font-family="monospace" font-size="11" fill="#e2e8f0">Class 1: Power User</text>
    <text x="20" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#06b6d4">94.8% Acc</text>

    <rect x="210" y="0" width="190" height="85" rx="10" fill="#0e0a22" stroke="#2a1f54"/>
    <circle cx="230" cy="25" r="5" fill="#ec4899"/>
    <text x="245" y="29" font-family="monospace" font-size="11" fill="#e2e8f0">Class 2: Casual User</text>
    <text x="230" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#ec4899">96.2% Acc</text>

    <rect x="420" y="0" width="190" height="85" rx="10" fill="#0e0a22" stroke="#2a1f54"/>
    <circle cx="440" cy="25" r="5" fill="#a855f7"/>
    <text x="455" y="29" font-family="monospace" font-size="11" fill="#e2e8f0">Class 3: Gamer / Streamer</text>
    <text x="440" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#a855f7">92.5% Acc</text>
  </g>

  <!-- Right: Model Benchmarks -->
  <rect x="740" y="180" width="410" height="520" rx="16" fill="url(#cardBg)" stroke="#38296e" stroke-width="1.5"/>
  <text x="770" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Algorithm Comparison</text>
  <text x="770" y="240" font-family="monospace" font-size="11" fill="#8b5cf6">Cross-Validation Accuracy Scores</text>

  <!-- Model Bars -->
  <g transform="translate(770, 270)">
    <!-- Random Forest -->
    <text x="0" y="16" font-family="monospace" font-size="12" fill="#e2e8f0">Random Forest</text>
    <text x="350" y="16" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="end">94.8% (Selected)</text>
    <rect x="0" y="25" width="350" height="12" rx="6" fill="#1e1840"/>
    <rect x="0" y="25" width="331" height="12" rx="6" fill="#10b981"/>

    <!-- XGBoost -->
    <text x="0" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">XGBoost Classifier</text>
    <text x="350" y="75" font-family="monospace" font-size="12" fill="#818cf8" text-anchor="end">94.1%</text>
    <rect x="0" y="85" width="350" height="12" rx="6" fill="#1e1840"/>
    <rect x="0" y="85" width="329" height="12" rx="6" fill="#818cf8"/>

    <!-- Decision Tree -->
    <text x="0" y="135" font-family="monospace" font-size="12" fill="#e2e8f0">Decision Tree</text>
    <text x="350" y="135" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="end">89.4%</text>
    <rect x="0" y="145" width="350" height="12" rx="6" fill="#1e1840"/>
    <rect x="0" y="145" width="312" height="12" rx="6" fill="#64748b"/>

    <!-- Logistic Regression -->
    <text x="0" y="195" font-family="monospace" font-size="12" fill="#e2e8f0">Multinomial Logistic</text>
    <text x="350" y="195" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="end">84.7%</text>
    <rect x="0" y="205" width="350" height="12" rx="6" fill="#1e1840"/>
    <rect x="0" y="205" width="296" height="12" rx="6" fill="#64748b"/>
  </g>

  <!-- Feature Importance -->
  <g transform="translate(770, 520)">
    <rect width="350" height="155" rx="10" fill="#0e0a22" stroke="#2a1f54"/>
    <text x="20" y="30" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Top Predictive Features</text>
    <text x="20" y="55" font-family="monospace" font-size="11" fill="#c4b5fd">1. App Usage Time (38.4%)</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#c4b5fd">2. Screen On Time (27.1%)</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#c4b5fd">3. Battery Consumption (19.8%)</text>
    <text x="20" y="130" font-family="monospace" font-size="11" fill="#c4b5fd">4. Number of Installed Apps (14.7%)</text>
  </g>
</svg>