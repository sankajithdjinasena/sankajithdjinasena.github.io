<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Window Header / Browser Chrome -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="400" height="22" rx="6" fill="#1e293b"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#94a3b8">crisp-dm://attrition.prediction.pipeline/dashboard</text>
  <rect x="1000" y="42" width="140" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="1015" y="57" font-family="monospace" font-size="10" fill="#34d399">● ROC-AUC: 0.814</text>

  <!-- Title & Subtitle -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Employee Attrition Prediction Model</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#64748b">6-STAGE CRISP-DM FRAMEWORK · 1,470 ENTERPRISE RECORDS · LOGISTIC REGRESSION</text>

  <!-- Left Card: ROC Curve & Confusion Metrics -->
  <rect x="50" y="180" width="530" height="520" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">ROC Performance Curve &amp; Metrics</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#64748b">True Positive Rate vs False Positive Rate</text>

  <!-- Coordinate Box -->
  <rect x="80" y="260" width="470" height="300" fill="#020617" rx="8" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="520" x2="510" y2="520" stroke="#334155" stroke-width="1.5"/>
  <line x1="120" y1="290" x2="120" y2="520" stroke="#334155" stroke-width="1.5"/>
  <!-- Diagonal baseline -->
  <line x1="120" y1="520" x2="510" y2="290" stroke="#475569" stroke-dasharray="4,4" stroke-width="1"/>
  <!-- Model Curve -->
  <path d="M 120 520 Q 150 330 250 310 T 510 290" fill="none" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)"/>
  <text x="180" y="380" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">AUC = 0.814</text>
  <text x="125" y="280" font-family="monospace" font-size="10" fill="#64748b">TPR 1.0</text>
  <text x="490" y="540" font-family="monospace" font-size="10" fill="#64748b">FPR 1.0</text>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 585)">
    <rect x="0" y="0" width="145" height="90" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="15" y="25" font-family="monospace" font-size="10" fill="#64748b">TARGET RECALL</text>
    <text x="15" y="60" font-family="monospace" font-size="26" font-weight="700" fill="#34d399">61.0%</text>
    <text x="15" y="78" font-family="monospace" font-size="9" fill="#10b981">+18.4% vs Baseline</text>

    <rect x="162" y="0" width="145" height="90" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="177" y="25" font-family="monospace" font-size="10" fill="#64748b">BALANCED ACCURACY</text>
    <text x="177" y="60" font-family="monospace" font-size="26" font-weight="700" fill="#38bdf8">86.4%</text>
    <text x="177" y="78" font-family="monospace" font-size="9" fill="#38bdf8">SMOTE Balanced</text>

    <rect x="325" y="0" width="145" height="90" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="340" y="25" font-family="monospace" font-size="10" fill="#64748b">OPERATIONAL COST</text>
    <text x="340" y="60" font-family="monospace" font-size="26" font-weight="700" fill="#f59e0b">-42%</text>
    <text x="340" y="78" font-family="monospace" font-size="9" fill="#fbbf24">Retention Savings</text>
  </g>

  <!-- Right Card: Primary Turnover Drivers & CRISP-DM Steps -->
  <rect x="610" y="180" width="540" height="520" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Primary Turnover Risk Coefficients</text>
  <text x="640" y="240" font-family="monospace" font-size="11" fill="#64748b">Feature Importance via Standardized Odds-Ratios</text>

  <!-- Feature Bars -->
  <g transform="translate(640, 270)">
    <!-- Feature 1 -->
    <text x="0" y="16" font-family="monospace" font-size="12" fill="#cbd5e1">Overtime = Yes</text>
    <text x="440" y="16" font-family="monospace" font-size="12" fill="#f43f5e" text-anchor="end">+1.98 Odds (High)</text>
    <rect x="0" y="25" width="440" height="12" rx="6" fill="#1e293b"/>
    <rect x="0" y="25" width="395" height="12" rx="6" fill="#f43f5e"/>

    <!-- Feature 2 -->
    <text x="0" y="70" font-family="monospace" font-size="12" fill="#cbd5e1">Years At Company (&lt; 2 Yrs)</text>
    <text x="440" y="70" font-family="monospace" font-size="12" fill="#fb923c" text-anchor="end">+1.42 Odds</text>
    <rect x="0" y="80" width="440" height="12" rx="6" fill="#1e293b"/>
    <rect x="0" y="80" width="310" height="12" rx="6" fill="#fb923c"/>

    <!-- Feature 3 -->
    <text x="0" y="125" font-family="monospace" font-size="12" fill="#cbd5e1">Monthly Income (Bottom Quartile)</text>
    <text x="440" y="125" font-family="monospace" font-size="12" fill="#eab308" text-anchor="end">+1.18 Odds</text>
    <rect x="0" y="135" width="440" height="12" rx="6" fill="#1e293b"/>
    <rect x="0" y="135" width="260" height="12" rx="6" fill="#eab308"/>

    <!-- Feature 4 -->
    <text x="0" y="180" font-family="monospace" font-size="12" fill="#cbd5e1">Total Working Years</text>
    <text x="440" y="180" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="end">-0.85 Odds (Protective)</text>
    <rect x="0" y="190" width="440" height="12" rx="6" fill="#1e293b"/>
    <rect x="0" y="190" width="190" height="12" rx="6" fill="#38bdf8"/>
  </g>

  <!-- CRISP-DM Flow Pipeline -->
  <text x="640" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">CRISP-DM Iterative Pipeline</text>
  <g transform="translate(640, 545)">
    <rect x="0" y="0" width="75" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="37" y="26" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Business</text>

    <text x="83" y="25" fill="#475569" font-size="12">→</text>

    <rect x="95" y="0" width="60" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="125" y="26" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Data</text>

    <text x="163" y="25" fill="#475569" font-size="12">→</text>

    <rect x="175" y="0" width="85" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="217" y="26" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Preparation</text>

    <text x="268" y="25" fill="#475569" font-size="12">→</text>

    <rect x="280" y="0" width="75" height="42" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="317" y="26" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">Modeling</text>

    <text x="363" y="25" fill="#475569" font-size="12">→</text>

    <rect x="375" y="0" width="75" height="42" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="412" y="26" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">Evaluation</text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(640, 620)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#1e293b"/>
    <text x="45" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">SCIKIT-LEARN</text>
    <rect x="98" y="0" width="70" height="26" rx="13" fill="#1e293b"/>
    <text x="133" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">SMOTE</text>
    <rect x="176" y="0" width="90" height="26" rx="13" fill="#1e293b"/>
    <text x="221" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">CRISP-DM</text>
    <rect x="274" y="0" width="70" height="26" rx="13" fill="#1e293b"/>
    <text x="309" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">PYTHON</text>
    <rect x="352" y="0" width="95" height="26" rx="13" fill="#1e293b"/>
    <text x="399" y="17" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">CLASSIFIER</text>
  </g>
</svg>