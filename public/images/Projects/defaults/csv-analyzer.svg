<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181829" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#0f111e" stroke="#252438" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="430" height="22" rx="6" fill="#1e1c30"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#a5b4fc">python://csv-analyzer.gui/interactive-eda-pipeline</text>
  <rect x="1000" y="42" width="140" height="22" rx="11" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1"/>
  <text x="1015" y="57" font-family="monospace" font-size="10" fill="#e879f9">● TKINTER &amp; EDA</text>

  <!-- Title -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">CSV Data Analyzer &amp; Interactive EDA Suite</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#818cf8">AUTOMATED DATA PROFILING · OUTLIER DETECTION · DYNAMIC MATPLOTLIB VISUALIZATIONS</text>

  <!-- Left: Data Grid Preview -->
  <rect x="50" y="180" width="620" height="520" rx="16" fill="url(#cardBg)" stroke="#2d2b45" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Interactive DataFrame Telemetry &amp; Profiler</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#64748b">50,000 Rows · 24 Columns · Real-time Previews</text>

  <!-- Table Container -->
  <g transform="translate(80, 260)">
    <rect width="560" height="260" fill="#090913" rx="8" stroke="#252438"/>
    <!-- Table Header -->
    <rect width="560" height="38" fill="#1e1c30" rx="8"/>
    <text x="20" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">ID</text>
    <text x="90" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">AGE</text>
    <text x="160" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">INCOME</text>
    <text x="260" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">CREDIT_SCORE</text>
    <text x="390" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">CHURN_STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="75" x2="560" y2="75" stroke="#1f1e33"/>
    <text x="20" y="62" font-family="monospace" font-size="11" fill="#e2e8f0">001</text>
    <text x="90" y="62" font-family="monospace" font-size="11" fill="#e2e8f0">34</text>
    <text x="160" y="62" font-family="monospace" font-size="11" fill="#e2e8f0">$72,400</text>
    <text x="260" y="62" font-family="monospace" font-size="11" fill="#34d399">742 (Good)</text>
    <text x="390" y="62" font-family="monospace" font-size="11" fill="#38bdf8">Active</text>

    <!-- Row 2 -->
    <line x1="0" y1="120" x2="560" y2="120" stroke="#1f1e33"/>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">002</text>
    <text x="90" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">48</text>
    <text x="160" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">$115,200</text>
    <text x="260" y="105" font-family="monospace" font-size="11" fill="#34d399">810 (Excellent)</text>
    <text x="390" y="105" font-family="monospace" font-size="11" fill="#38bdf8">Active</text>

    <!-- Row 3 -->
    <line x1="0" y1="165" x2="560" y2="165" stroke="#1f1e33"/>
    <text x="20" y="150" font-family="monospace" font-size="11" fill="#e2e8f0">003</text>
    <text x="90" y="150" font-family="monospace" font-size="11" fill="#e2e8f0">22</text>
    <text x="160" y="150" font-family="monospace" font-size="11" fill="#e2e8f0">$28,500</text>
    <text x="260" y="150" font-family="monospace" font-size="11" fill="#f43f5e">580 (Low)</text>
    <text x="390" y="150" font-family="monospace" font-size="11" fill="#f43f5e">At-Risk</text>

    <!-- Row 4 -->
    <line x1="0" y1="210" x2="560" y2="210" stroke="#1f1e33"/>
    <text x="20" y="195" font-family="monospace" font-size="11" fill="#e2e8f0">004</text>
    <text x="90" y="195" font-family="monospace" font-size="11" fill="#e2e8f0">56</text>
    <text x="160" y="195" font-family="monospace" font-size="11" fill="#e2e8f0">$98,000</text>
    <text x="260" y="195" font-family="monospace" font-size="11" fill="#34d399">790 (Good)</text>
    <text x="390" y="195" font-family="monospace" font-size="11" fill="#38bdf8">Active</text>

    <text x="20" y="240" font-family="monospace" font-size="10" fill="#64748b">Showing 4 of 50,000 rows (Cleaned &amp; Imputed)</text>
  </g>

  <!-- Summary stats -->
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="175" height="110" rx="10" fill="#090913" stroke="#252438"/>
    <text x="16" y="28" font-family="monospace" font-size="10" fill="#64748b">MISSING VALUES</text>
    <text x="16" y="66" font-family="monospace" font-size="28" font-weight="700" fill="#34d399">0.0%</text>
    <text x="16" y="90" font-family="monospace" font-size="10" fill="#a5b4fc">KNN Imputed</text>

    <rect x="192" y="0" width="175" height="110" rx="10" fill="#090913" stroke="#252438"/>
    <text x="208" y="28" font-family="monospace" font-size="10" fill="#64748b">OUTLIERS FLAGGED</text>
    <text x="208" y="66" font-family="monospace" font-size="28" font-weight="700" fill="#f59e0b">218</text>
    <text x="208" y="90" font-family="monospace" font-size="10" fill="#a5b4fc">IQR 1.5× Rule</text>

    <rect x="385" y="0" width="175" height="110" rx="10" fill="#090913" stroke="#252438"/>
    <text x="401" y="28" font-family="monospace" font-size="10" fill="#64748b">PARSING SPEED</text>
    <text x="401" y="66" font-family="monospace" font-size="28" font-weight="700" fill="#c084fc">0.42s</text>
    <text x="401" y="90" font-family="monospace" font-size="10" fill="#a5b4fc">Vectorized C-Engine</text>
  </g>

  <!-- Right: Correlation Matrix & Visualizations -->
  <rect x="690" y="180" width="460" height="520" rx="16" fill="url(#cardBg)" stroke="#2d2b45" stroke-width="1.5"/>
  <text x="720" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Correlation Heatmap &amp; Histograms</text>
  <text x="720" y="240" font-family="monospace" font-size="11" fill="#64748b">Pearson Correlation Matrix</text>

  <!-- Heatmap Visual -->
  <g transform="translate(720, 265)">
    <rect x="0" y="0" width="85" height="55" rx="6" fill="#a855f7" fill-opacity="0.8"/>
    <text x="42" y="34" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1.00</text>

    <rect x="95" y="0" width="85" height="55" rx="6" fill="#a855f7" fill-opacity="0.5"/>
    <text x="137" y="34" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0.68</text>

    <rect x="190" y="0" width="85" height="55" rx="6" fill="#1e1c30"/>
    <text x="232" y="34" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">-0.12</text>

    <rect x="285" y="0" width="85" height="55" rx="6" fill="#ec4899" fill-opacity="0.4"/>
    <text x="327" y="34" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">-0.45</text>

    <!-- Row 2 -->
    <rect x="0" y="65" width="85" height="55" rx="6" fill="#a855f7" fill-opacity="0.5"/>
    <text x="42" y="99" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0.68</text>

    <rect x="95" y="65" width="85" height="55" rx="6" fill="#a855f7" fill-opacity="0.8"/>
    <text x="137" y="99" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1.00</text>

    <rect x="190" y="65" width="85" height="55" rx="6" fill="#a855f7" fill-opacity="0.3"/>
    <text x="232" y="99" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">0.31</text>

    <rect x="285" y="65" width="85" height="55" rx="6" fill="#ec4899" fill-opacity="0.6"/>
    <text x="327" y="99" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">-0.62</text>
  </g>

  <!-- Distribution Bars -->
  <g transform="translate(720, 420)">
    <rect width="400" height="240" fill="#090913" rx="10" stroke="#252438"/>
    <text x="20" y="30" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Dynamic Frequency Distribution</text>
    
    <!-- Bars -->
    <rect x="40" y="140" width="30" height="60" rx="3" fill="#818cf8"/>
    <rect x="80" y="110" width="30" height="90" rx="3" fill="#818cf8"/>
    <rect x="120" y="70" width="30" height="130" rx="3" fill="#a855f7"/>
    <rect x="160" y="50" width="30" height="150" rx="3" fill="#c084fc"/>
    <rect x="200" y="65" width="30" height="135" rx="3" fill="#a855f7"/>
    <rect x="240" y="100" width="30" height="100" rx="3" fill="#818cf8"/>
    <rect x="280" y="130" width="30" height="70" rx="3" fill="#818cf8"/>
    <rect x="320" y="160" width="30" height="40" rx="3" fill="#6366f1"/>
    
    <line x1="30" y1="200" x2="370" y2="200" stroke="#334155"/>
    <text x="200" y="222" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Normalized Feature Space</text>
  </g>
</svg>