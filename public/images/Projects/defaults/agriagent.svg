<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140d"/>
      <stop offset="50%" stop-color="#092015"/>
      <stop offset="100%" stop-color="#020a06"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2d1e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#071b12" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#091f15" stroke="#143d29" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="460" height="22" rx="6" fill="#123524"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#86efac">agriagent://trilingual-faiss.llm/farm-advisory-system</text>
  <rect x="1000" y="42" width="140" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="1015" y="57" font-family="monospace" font-size="10" fill="#34d399">● GROQ LLM AGENT</text>

  <!-- Title -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">AgriAgent - Multilingual AI Farm Advisory System</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#34d399">TRILINGUAL (EN/SI/TA) · FAISS VECTOR RETRIEVAL · REAL-TIME CROP ADVISORY &amp; WEATHER</text>

  <!-- Left: Trilingual NLP & Vector Retrieval Flow -->
  <rect x="50" y="180" width="670" height="520" rx="16" fill="url(#cardBg)" stroke="#164d33" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Trilingual Semantic Vector Search Pipeline</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#6ee7b7">Dense Embeddings via Sentence-Transformers into FAISS</text>

  <!-- Visual Workflow -->
  <g transform="translate(80, 270)">
    <rect width="610" height="260" fill="#03120a" rx="10" stroke="#0e3322"/>
    
    <!-- Input Prompts -->
    <rect x="30" y="30" width="160" height="45" rx="8" fill="#092015" stroke="#10b981"/>
    <text x="45" y="52" font-family="monospace" font-size="11" fill="#86efac">"පොහොර යෙදීම?"</text>
    <text x="45" y="66" font-family="monospace" font-size="9" fill="#6ee7b7">Sinhala Farmer Query</text>

    <rect x="30" y="90" width="160" height="45" rx="8" fill="#092015" stroke="#10b981"/>
    <text x="45" y="112" font-family="monospace" font-size="11" fill="#86efac">"Paddy Blast Cure?"</text>
    <text x="45" y="126" font-family="monospace" font-size="9" fill="#6ee7b7">English Agronomy Query</text>

    <rect x="30" y="150" width="160" height="45" rx="8" fill="#092015" stroke="#10b981"/>
    <text x="45" y="172" font-family="monospace" font-size="11" fill="#86efac">"உர ஆலோசனை?"</text>
    <text x="45" y="186" font-family="monospace" font-size="9" fill="#6ee7b7">Tamil Crop Query</text>

    <!-- Arrow to Embeddings -->
    <line x1="200" y1="112" x2="250" y2="112" stroke="#10b981" stroke-width="2"/>
    <polygon points="255,112 245,107 245,117" fill="#10b981"/>

    <!-- Embeddings Box -->
    <rect x="260" y="55" width="130" height="115" rx="10" fill="#0c2b1c" stroke="#34d399" stroke-width="1.5"/>
    <text x="325" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">FAISS</text>
    <text x="325" y="115" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">IndexFlatL2</text>
    <text x="325" y="135" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">384-Dim Vectors</text>

    <!-- Arrow to Groq LLM -->
    <line x1="400" y1="112" x2="445" y2="112" stroke="#34d399" stroke-width="2"/>
    <polygon points="450,112 440,107 440,117" fill="#34d399"/>

    <!-- Groq Engine -->
    <rect x="455" y="45" width="130" height="135" rx="10" fill="#092015" stroke="#10b981" stroke-width="2"/>
    <text x="520" y="85" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">GROQ LPU</text>
    <text x="520" y="105" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">Llama 3.3 70B</text>
    <text x="520" y="125" font-family="monospace" font-size="9" fill="#86efac" text-anchor="middle">0.24s Latency</text>
    <text x="520" y="145" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Streaming Output</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="190" height="110" rx="10" fill="#03120a" stroke="#0e3322"/>
    <text x="18" y="30" font-family="monospace" font-size="11" fill="#6ee7b7">LANGUAGES</text>
    <text x="18" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#34d399">3</text>
    <text x="18" y="92" font-family="monospace" font-size="10" fill="#86efac">Sinhala, Tamil, English</text>

    <rect x="210" y="0" width="190" height="110" rx="10" fill="#03120a" stroke="#0e3322"/>
    <text x="228" y="30" font-family="monospace" font-size="11" fill="#6ee7b7">INFERENCE TIME</text>
    <text x="228" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#38bdf8">240ms</text>
    <text x="228" y="92" font-family="monospace" font-size="10" fill="#86efac">Groq Accelerated</text>

    <rect x="420" y="0" width="190" height="110" rx="10" fill="#03120a" stroke="#0e3322"/>
    <text x="438" y="30" font-family="monospace" font-size="11" fill="#6ee7b7">INDEXED CROPS</text>
    <text x="438" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#f59e0b">42+</text>
    <text x="438" y="92" font-family="monospace" font-size="10" fill="#86efac">Tropical Varieties</text>
  </g>

  <!-- Right: Farm Advisory Dashboard Card -->
  <rect x="740" y="180" width="410" height="520" rx="16" fill="url(#cardBg)" stroke="#164d33" stroke-width="1.5"/>
  <text x="770" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Interactive Advisory Telemetry</text>
  <text x="770" y="240" font-family="monospace" font-size="11" fill="#6ee7b7">Soil Moisture · Weather · Disease Scanner</text>

  <g transform="translate(770, 270)">
    <rect width="350" height="230" rx="10" fill="#03120a" stroke="#0e3322"/>
    <text x="20" y="32" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399">Live Advisory Output</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#f8fafc">Crop: Paddy (Oryza sativa)</text>
    <text x="20" y="82" font-family="monospace" font-size="11" fill="#f8fafc">Condition: Moderate Brown Spot</text>
    <text x="20" y="104" font-family="monospace" font-size="11" fill="#86efac">Recommended: Mancozeb 75% WP</text>
    <text x="20" y="126" font-family="monospace" font-size="11" fill="#e2e8f0">Rain Forecast: 18mm in 3 hrs</text>
    <text x="20" y="148" font-family="monospace" font-size="11" fill="#fb923c">Action: Delay spray until clear</text>
    <rect x="20" y="170" width="310" height="35" rx="6" fill="#092015" stroke="#10b981"/>
    <text x="175" y="192" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">✔ Advisory Dispatched via SMS</text>
  </g>

  <g transform="translate(770, 530)">
    <rect width="350" height="140" rx="10" fill="#03120a" stroke="#0e3322"/>
    <text x="20" y="30" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Technology Stack</text>
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="65" height="24" rx="12" fill="#0f2d1e"/>
      <text x="32" y="16" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">PYTHON</text>
      <rect x="73" y="0" width="70" height="24" rx="12" fill="#0f2d1e"/>
      <text x="108" y="16" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">FASTAPI</text>
      <rect x="151" y="0" width="60" height="24" rx="12" fill="#0f2d1e"/>
      <text x="181" y="16" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">FAISS</text>
      <rect x="219" y="0" width="60" height="24" rx="12" fill="#0f2d1e"/>
      <text x="249" y="16" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">GROQ</text>
    </g>
  </g>
</svg>