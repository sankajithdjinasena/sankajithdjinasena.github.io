<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#090d21"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="areaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Subtle Financial Grid -->
  <g stroke="#1e293b" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Browser Header -->
  <rect x="40" y="30" width="1120" height="45" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="6" fill="#ef4444"/>
  <circle cx="92" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="52" r="6" fill="#10b981"/>
  <rect x="150" y="42" width="460" height="22" rx="6" fill="#1e293b"/>
  <text x="170" y="57" font-family="monospace" font-size="11" fill="#94a3b8">quant://msft.historical-returns.1986-2025/markov-monte-carlo</text>
  <rect x="990" y="42" width="150" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="1005" y="57" font-family="monospace" font-size="10" fill="#38bdf8">● 39-YEAR HISTORICAL</text>

  <!-- Title -->
  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Microsoft Stock Probability &amp; Risk Modeling</text>
  <text x="50" y="152" font-family="monospace" font-size="13" fill="#64748b">PARAMETRIC DISTRIBUTIONS (STUDENT'S T) · MARKOV CHAINS · 5,000-PATH MONTE CARLO</text>

  <!-- Left: Monte Carlo Fan Chart & Return Distribution -->
  <rect x="50" y="180" width="670" height="520" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">5,000-Path Monte Carlo Geometric Brownian Motion</text>
  <text x="80" y="240" font-family="monospace" font-size="11" fill="#64748b">Forecast Horizon + Empirical VaR (95% &amp; 99% CI)</text>

  <!-- Chart Area -->
  <g transform="translate(80, 260)">
    <rect width="610" height="280" fill="#030712" rx="8" stroke="#1f2937"/>
    <!-- Grid -->
    <line x1="0" y1="70" x2="610" y2="70" stroke="#1f2937"/>
    <line x1="0" y1="140" x2="610" y2="140" stroke="#1f2937"/>
    <line x1="0" y1="210" x2="610" y2="210" stroke="#1f2937"/>
    
    <!-- Monte Carlo Fan Paths (Simulated ribbons) -->
    <path d="M 40 180 Q 200 160 350 90 T 570 40" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M 40 180 Q 220 170 380 120 T 570 70" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M 40 180 Q 250 175 400 150 T 570 120" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M 40 180 Q 200 180 370 160 T 570 165" fill="none" stroke="#818cf8" stroke-opacity="0.7" stroke-width="2.5"/>
    <!-- Median Path -->
    <path d="M 40 180 Q 200 185 360 170 T 570 140" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <!-- Downside Paths -->
    <path d="M 40 180 Q 200 200 370 210 T 570 215" fill="none" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M 40 180 Q 220 210 390 235 T 570 255" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Confidence Fill -->
    <path d="M 40 180 Q 200 160 350 90 T 570 40 L 570 255 Q 390 235 220 210 T 40 180 Z" fill="url(#areaGlow)"/>

    <text x="50" y="195" font-family="monospace" font-size="11" fill="#94a3b8">S₀: $428.50</text>
    <text x="500" y="55" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">95th %ile</text>
    <text x="500" y="135" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">Median Path</text>
    <text x="500" y="245" font-family="monospace" font-size="11" font-weight="bold" fill="#f43f5e">5th %ile (VaR)</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="190" height="110" rx="10" fill="#030712" stroke="#1f2937"/>
    <text x="18" y="30" font-family="monospace" font-size="11" fill="#64748b">VALUE AT RISK (95%)</text>
    <text x="18" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#f43f5e">-2.84%</text>
    <text x="18" y="92" font-family="monospace" font-size="10" fill="#94a3b8">Daily Max Loss (1-Day)</text>

    <rect x="210" y="0" width="190" height="110" rx="10" fill="#030712" stroke="#1f2937"/>
    <text x="228" y="30" font-family="monospace" font-size="11" fill="#64748b">CONDITIONAL VaR</text>
    <text x="228" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#fb923c">-4.12%</text>
    <text x="228" y="92" font-family="monospace" font-size="10" fill="#94a3b8">Expected Shortfall</text>

    <rect x="420" y="0" width="190" height="110" rx="10" fill="#030712" stroke="#1f2937"/>
    <text x="438" y="30" font-family="monospace" font-size="11" fill="#64748b">ANNUALIZED SHARPE</text>
    <text x="438" y="70" font-family="monospace" font-size="28" font-weight="700" fill="#34d399">1.48</text>
    <text x="438" y="92" font-family="monospace" font-size="10" fill="#94a3b8">Risk-Adjusted Return</text>
  </g>

  <!-- Right: Markov Transition Matrix -->
  <rect x="740" y="180" width="410" height="520" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="770" y="220" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Markov Transition Matrix</text>
  <text x="770" y="240" font-family="monospace" font-size="11" fill="#64748b">3-State Daily Market Regime Probabilities</text>

  <!-- Matrix Grid -->
  <g transform="translate(770, 275)">
    <!-- Headers -->
    <text x="100" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">BULL (Up)</text>
    <text x="200" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">NEUTRAL</text>
    <text x="300" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#f43f5e" text-anchor="middle">BEAR (Down)</text>

    <!-- Row 1: Bull -->
    <text x="0" y="65" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">Bull</text>
    <rect x="60" y="42" width="80" height="40" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#0284c7"/>
    <text x="100" y="67" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">53.2%</text>

    <rect x="160" y="42" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="200" y="67" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">18.6%</text>

    <rect x="260" y="42" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="300" y="67" font-family="monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">28.2%</text>

    <!-- Row 2: Neutral -->
    <text x="0" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#94a3b8">Neutral</text>
    <rect x="60" y="102" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="100" y="127" font-family="monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">38.4%</text>

    <rect x="160" y="102" width="80" height="40" rx="6" fill="#475569" fill-opacity="0.4" stroke="#64748b"/>
    <text x="200" y="127" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">32.1%</text>

    <rect x="260" y="102" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="300" y="127" font-family="monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">29.5%</text>

    <!-- Row 3: Bear -->
    <text x="0" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#f43f5e">Bear</text>
    <rect x="60" y="162" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="100" y="187" font-family="monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">44.8%</text>

    <rect x="160" y="162" width="80" height="40" rx="6" fill="#1e293b"/>
    <text x="200" y="187" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">16.3%</text>

    <rect x="260" y="162" width="80" height="40" rx="6" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48"/>
    <text x="300" y="187" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">38.9%</text>
  </g>

  <!-- Distribution Box -->
  <g transform="translate(770, 520)">
    <rect width="350" height="145" rx="10" fill="#030712" stroke="#1f2937"/>
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Student's t Tail Parameter</text>
    <text x="16" y="46" font-family="monospace" font-size="10" fill="#64748b">Degrees of Freedom ν = 3.82 (Fat Tails)</text>
    <path d="M 20 120 Q 175 60 330 120" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M 20 120 Q 175 75 330 120" fill="none" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="175" y="90" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">Actual vs Normal Bell</text>
  </g>
</svg>